<html>
  <head>
    <title>Schairer Designs</title>
  <style>
  /* Elements start hidden */
  .scroll-animate {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  /* Activated when scrolled into view */
  .scroll-animate.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Different animation directions */
  .slide-left {
    transform: translateX(-60px);
  }

  .slide-right {
    transform: translateX(60px);
  }

  .zoom-in {
    transform: scale(0.85);
  }

  .fade-in {
    transform: none;
  }

  .scroll-animate.show.slide-left,
  .scroll-animate.show.slide-right,
  .scroll-animate.show.zoom-in {
    transform: translateX(0) scale(1);
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    .scroll-animate {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
</style>
  </head>
  <body style="background-image:url('https://wallpapercave.com/mwp/wp2804137.jpg')">
<h1 id="home-title"></h1>

<h2 id="home-subtitle"></h2>

<p id="home-description"></p>
    <script src="/js/content.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", function () {

  const animatedElements = document.querySelectorAll(".scroll-animate");

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
          observer.unobserve(entry.target);
        }
      });
    },
    {
      threshold: 0.15
    }
  );

  animatedElements.forEach((element) => {
    observer.observe(element);
  });

});
</script>
  </body>
</html>
